<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Overheads - a roof over your head</title>
    <meta
      name="description"
      content="Oferty najmu w Krakowie z OLX i Otodom, z policzonym prawdziwym kosztem miesięcznym."
    />
    <script>
      // Before first paint, so the page never flashes the other theme. React reads the
      // same key afterwards and takes it from here.
      (function () {
        var theme = 'dark';
        try {
          // Both names: the key was renamed with the product, and React moves the value
          // across on first read. This runs before React, so it has to know both or the
          // page would flash the wrong theme once for everybody who visited before.
          var stored =
            localStorage.getItem('overheads:theme') ?? localStorage.getItem('flatradar:theme');
          var system = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          theme = stored === 'light' || stored === 'dark' ? stored : system;
        } catch (error) {
          theme = 'dark';
        }
        // The class is what Radix Colors keys its dark scales on.
        document.documentElement.dataset.theme = theme;
        document.documentElement.classList.add(theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
