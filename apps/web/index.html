<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <title>FlatRadar — mieszkania w Krakowie</title>
    <script>
      // Before first paint, so the page never flashes the other theme. React reads the
      // same key afterwards and takes it from here.
      (function () {
        var theme = 'dark';
        try {
          var stored = localStorage.getItem('flatradar:theme');
          var system = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          theme = stored === 'light' || stored === 'dark' ? stored : system;
        } catch (error) {
          theme = 'dark';
        }
        // The class is what Radix Colors keys its dark scales on.
        document.documentElement.dataset.theme = theme;
        document.documentElement.classList.add(theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
