name: Collect

on:
  schedule:
    # Every 15 minutes. GitHub runs scheduled jobs late under load; it is a floor, not a promise.
    - cron: '*/15 * * * *'
  # So a round can be started by hand from the Actions tab.
  workflow_dispatch:

# A slow round must not overlap the next one and fight it over the same rows.
concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm collect
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # OLX answers 403 from datacenter addresses. It is collected from a machine
          # on a normal connection instead, not disguised into getting through here.
          OVERHEADS_SOURCES: otodom
