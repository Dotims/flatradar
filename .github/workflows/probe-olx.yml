name: Probe OLX

# One-off, to be deleted once it has answered.
#
# OLX collection was moved off this repository because a datacenter address got a 403,
# measured over HTTP/1.1. On 2026-08-15 the portal started refusing HTTP/1.1 from an
# ordinary home connection too, and answering the same request over HTTP/2. If those are
# one rule rather than two, GitHub can collect OLX itself and the flat-hunting stops
# depending on one computer being awake. Three requests, spaced, then it says what it saw.

on:
  push:
    branches: [fix/olx-http2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: The offers API from a datacenter address
        env:
          URL: 'https://www.olx.pl/api/v1/offers/?offset=0&limit=5&category_id=15&city_id=8959&sort_by=created_at%3Adesc'
          UA: 'Overheads/0.1 (+https://github.com/Dotims/overheads)'
        run: |
          echo -n 'curl http/1.1: '
          curl -s -o /dev/null -w '%{http_version} -> %{http_code}\n' \
            --http1.1 -H "User-Agent: $UA" -H 'Accept: application/json' "$URL"
          sleep 5

          echo -n 'curl http/2:   '
          curl -s -o /dev/null -w '%{http_version} -> %{http_code}\n' \
            --http2 -H "User-Agent: $UA" -H 'Accept: application/json' "$URL"
          sleep 5

          echo 'the collector transport, four times over two minutes:'
          node --input-type=module -e "
            const { requestHttp2 } = await import('./apps/collector/src/sources/http2.ts');
            const headers = { 'User-Agent': process.env.UA, Accept: 'application/json' };

            for (let round = 1; round <= 4; round++) {
              if (round > 1) await new Promise((r) => setTimeout(r, 30_000));
              const reply = await requestHttp2(process.env.URL, headers, 15_000);
              let offers = 'unreadable';
              try {
                offers = String(JSON.parse(reply.body).data.length);
              } catch {}
              console.log(\`  round \${round}: \${reply.status}, offers \${offers}\`);
            }
          "
